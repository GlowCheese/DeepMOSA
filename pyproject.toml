[project]
name = "deepmosa"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "asciitree~=0.3.3",
    "astroid~=3.3.8",
    "black~=25.12.0",
    "bytecode~=0.16.1",
    "colorama~=0.4.6",
    "jellyfish~=1.1.3",
    "jinja2~=3.1.6",
    "litellm>=1.80.11",
    "networkx~=3.4.2",
    "openai~=2.14.0",
    "pytest~=9.0.2",
    "python-dotenv~=1.2.1",
    "ruff~=0.14.9",
    "setuptools~=80.9.0",
    "simple-parsing~=0.1.7",
    "transformers~=4.57.3",
    "typing-inspect~=0.9.0",
]

[dependency-groups]
dev = [
    "pandas[excel]~=2.3.3",
    "pipdeptree>=2.30.0",
    "pre-commit~=4.5.0",
    "ruff>=0.14.9",
    "ty>=0.0.13",
]
minbpe = [
    "regex>=2025.11.3",
    "tiktoken>=0.12.0",
]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["experiments/projects", "generated_tests", "pynguin_report"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pyright]
typeCheckingMode = "basic"
include = ["pynguin", "libs", "tests", "experiments"]
exclude = ["**/__pycache__", "experiments/projects", "generated_tests", "pynguin_report"]
pythonVersion = "3.10"
venvPath = "."
venv = ".venv"

[project.scripts]
pynguin = "pynguin.cli:main"

[tool.setuptools.packages.find]
include = ["pynguin*", "libs*"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
