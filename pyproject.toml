[project]
name = "deepmosa"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "asciitree~=0.3.3",
    "astroid~=3.3.8",
    "black>=25.12.0",
    "bytecode~=0.16.1",
    "colorama~=0.4.6",
    "jellyfish~=1.1.3",
    "networkx~=3.4.2",
    "openai~=2.14.0",
    "pytest~=9.0.2",
    "python-dotenv~=1.2.1",
    "ruff~=0.14.9",
    "setuptools~=80.9.0",
    "simple-parsing>=0.1.7",
    "transformers~=4.57.3",
    "typing-inspect~=0.9.0",
]

[dependency-groups]
dev = [
    "pre-commit~=4.5.0",
    "ruff>=0.14.9",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
